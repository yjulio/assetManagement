<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - DLA Asset Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .offline-container {
            text-align: center;
            color: white;
            padding: 2rem;
        }

        .offline-icon {
            font-size: 5rem;
            margin-bottom: 1rem;
        }

        .offline-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 2rem;
            color: #333;
            max-width: 500px;
            margin: 0 auto;
        }
    </style>
</head>

<body>
    <div class="offline-container">
        <div class="offline-icon">
            <i class="bi bi-wifi-off"></i>
        </div>

        <div class="offline-card">
            <h2>You're Offline</h2>
            <p class="lead">No internet connection available</p>

            <hr>

            <p>Don't worry! Your cached data is still available.</p>

            <div class="alert alert-info">
                <i class="bi bi-info-circle"></i>
                <strong>Offline Mode Features:</strong>
                <ul class="text-start mt-2 mb-0">
                    <li>View cached asset information</li>
                    <li>Take photos (saved locally)</li>
                    <li>Create handover signatures</li>
                    <li>Scan QR codes</li>
                </ul>
            </div>

            <p class="text-muted small">
                Your changes will be synchronized when you're back online.
            </p>

            <button class="btn btn-primary" onclick="location.reload()">
                <i class="bi bi-arrow-clockwise"></i> Try Again
            </button>
        </div>
    </div>

    <script>
        // Auto-retry connection
        setInterval(function () {
            if (navigator.onLine) {
                location.reload();
            }
        }, 5000);
    </script>
</body>

</html>
